name: nana-core-independent
services:
  # No service starts by default. Actual production activation is NOT authorized.
  core:
    profiles: [after-explicit-activation-approval]
    image: ${NANA_VERIFIED_IMAGE:?supply_qualified_image_digest}
    user: '999:999'
    init: true
    command: [serve]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 20s
    ports: ['127.0.0.1:18765:18765']
    volumes:
      - type: bind
        source: /srv/nana-core/runtime
        target: /opt/nana-core/runtime
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/nana-core/data
        target: /opt/nana-core/data
        bind: {create_host_path: false}
      - type: bind
        source: /srv/nana-core/logs
        target: /opt/nana-core/logs
        bind: {create_host_path: false}
      - type: bind
        source: /srv/nana-core/backups
        target: /opt/nana-core/backups
        bind: {create_host_path: false}
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=999,gid=999,mode=1770']
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '3'}
    healthcheck:
      test: [CMD, /usr/bin/python3, -I, /usr/local/lib/nana/container_entry.py, health]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
    # Never mount docker.sock, hostroot, AstrBot data, QQ/Iris data or devices.
