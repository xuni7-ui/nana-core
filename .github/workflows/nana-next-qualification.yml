name: Nana Next source qualification

# Explicit qualification of the inherited continuation; no deployment or model calls.
on:
  workflow_dispatch:
    inputs:
      qualification:
        description: 'Targeted integration, or full release/data-migration qualification'
        type: choice
        default: targeted
        options: [targeted, full]
  push:
    branches: [dev/nana-core-next-experience-codex]
    paths:
      - .github/workflows/nana-next-qualification.yml
      - tools/nana_portable_cloud/build.py
      - tools/nana_portable_cloud/unpack.py
      - packaging/portable/**
      - requirements-core-dev.lock
      - src/nana_core/continuity/context.py
      - src/nana_core/continuity/retrieval_growth.py
      - tests/independent_life/test_retrieval_growth.py
      - tests/independent_life/test_retrieval_growth_expanded.py
      - tests/independent_life/test_note_recall.py
      - src/nana_core/continuity/privacy.py
      - tests/continuous_self/test_privacy_copy_increment.py
      - src/nana_core/continuity/open_life/opportunities.py
      - tests/open_life/test_adopted_interest.py
      - src/nana_core/continuity/subject/policy.py
      - src/nana_core/continuity/subject/context_fit.py
      - tests/vision_first/test_context_fit.py
      - src/nana_core/continuity/lived_language.py
      - src/nana_core/life/live_api/provider_settings.py
      - src/nana_core/life/live_api/server.py
      - src/nana_core/life/live_api/auth.py
      - tests/first_life_android_v2/test_response_authorization.py
      - tests/first_life_android_v2/test_provider_runtime_settings.py
      - src/nana_core/life/live_api/bridge.py
      - src/nana_core/life/live_api/contracts.py
      - tests/first_life_android_v2/test_long_feedback.py
      - tests/person_self/test_long_feedback_binding.py
      - tests/open_autonomy/test_delivery.py
      - tools/nana_astrbot_shadow/bridge_wire.py
      - src/plugins/astrbot_plugin_nana_shadow_observer/bridge_wire.py
      - tests/nana_shadow/test_r044_filesystem.py
      - src/nana_core/life/control.py
      - src/nana_core/life/surfaces.py
      - src/nana_core/life/__main__.py
      - src/nana_core/life/application.py
      - src/nana_core/life/dialogue_contracts.py
      - src/nana_core/continuity/world_loop/cognition.py
      - src/nana_core/continuity/person_self.py
      - tests/first_life_android_v2/test_continuous_inputs.py
      - tests/first_life_android_v2/test_conversation_sequence.py
      - tests/first_life_android_v2/test_message_sequence_http.py
      - tools/nana_first_life_android_v2/schema.py
      - tools/nana_first_life_android_v2/dev_serve.py
      - tests/independent_life/test_dialogue.py
      - tools/nana_first_life_android_v2/b1_backup.py
      - tests/first_life_android_v2/test_rev3_operator.py
      - apps/nana-space/**

permissions:
  contents: read

jobs:
  affected-components:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.paths.outputs.core }}
      client: ${{ steps.paths.outputs.client }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: paths
        env:
          NANA_CHANGE_BASE: ${{ github.event.before }}
          NANA_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYPATHS'
          import os, subprocess
          base=os.environ.get('NANA_CHANGE_BASE') or 'HEAD^'
          if set(base)=={'0'}:base='HEAD^'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          workflow='.github/workflows/nana-next-qualification.yml'
          explicit=os.environ['NANA_EVENT_NAME']=='workflow_dispatch' or workflow in paths
          core=explicit or any(p.startswith(('src/nana_core/','tools/nana_','packaging/portable/','tests/','contracts/','requirements-core-dev.lock')) for p in paths)
          client=explicit or any(p.startswith(('apps/nana-space/','contracts/nana-space-live-v2/','src/nana_core/life/live_api/bridge.py','src/nana_core/life/live_api/contracts.py','tools/nana_first_life_android_v2/schema.py')) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'core={str(core).lower()}\nclient={str(client).lower()}\n')
          print('Affected components:',{'core':core,'client':client})
          PYPATHS

  original-core-feedback:
    needs: affected-components
    if: needs.affected-components.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Run the original bwrap qualification on the disposable GitHub runner host.
    # A nested Debian Actions container cannot mount /proc under the hosted
    # runner's container boundary, even when the original probe is otherwise valid.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NANA_FULL_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification == 'full' }}
    steps:
      - name: Full qualification host and old SQLite fixture
        if: env.NANA_FULL_QUALIFICATION == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap ffmpeg gnupg
          if sudo grep -RqsE 'profile[[:space:]]+[^[:space:]]+[[:space:]]+/usr/bin/bwrap([[:space:]]|$)' /etc/apparmor.d; then
            echo 'Existing AppArmor attachment for /usr/bin/bwrap; refusing to replace it.' >&2
            exit 1
          fi
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          command -v docker
          mkdir -p /tmp/nana-old-sqlite-context
          docker build --tag nana-old-sqlite:3.46.1 -f - /tmp/nana-old-sqlite-context <<'DOCKERFILE'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install --yes --no-install-recommends python3 && rm -rf /var/lib/apt/lists/* && /usr/bin/python3 -I -c 'import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version == "3.46.1"'
          ENTRYPOINT ["/usr/bin/python3"]
          DOCKERFILE
          sudo tee /usr/local/bin/nana-old-sqlite-python >/dev/null <<WRAPPER
          #!/bin/sh
          exec docker run --rm --network none --read-only --user "\$(id -u):\$(id -g)" \
            --env PYTHONDONTWRITEBYTECODE=1 --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,src=/tmp/nq,dst=/tmp/nq,readonly" \
            --workdir "$GITHUB_WORKSPACE" nana-old-sqlite:3.46.1 "\$@"
          WRAPPER
          sudo chmod 0755 /usr/local/bin/nana-old-sqlite-python
          mkdir -p /tmp/nq
          cat > /tmp/nq/nana-old-sqlite-probe.py <<'PYOLD'
          import sqlite3
          print(sqlite3.sqlite_version)
          assert sqlite3.sqlite_version == '3.46.1'
          PYOLD
          /usr/local/bin/nana-old-sqlite-python -I /tmp/nq/nana-old-sqlite-probe.py
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 TZ=UTC \
            /usr/local/bin/nana-old-sqlite-python -I -c 'import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version == "3.46.1"'
          rm /tmp/nq/nana-old-sqlite-probe.py
          /usr/local/bin/nana-old-sqlite-python -I -c 'import sqlite3; assert sqlite3.sqlite_version == "3.46.1"'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # setup-python's host-linked SQLite failed the existing minimum gate.
      # Use a private standalone interpreter; never replace a system library.
      - uses: astral-sh/setup-uv@v6
      - run: |
          umask 077
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          if [ "$NANA_FULL_QUALIFICATION" = true ]; then
            command -v ffmpeg
            command -v gpgconf
            command -v bwrap
          fi
          uv python install 3.12.14
          uv venv --python 3.12.14 .qualification-venv
          uv pip install --python .qualification-venv/bin/python -r requirements-core-dev.lock
          .qualification-venv/bin/python - <<'PYDEPS' > qualification-feature-requirements.txt
          from tools.nana_portable_cloud.build import FEATURE_DEPENDENCIES
          for feature in ('HOST_VAULT', 'PUBLIC_VIDEO_FRAMES'):
              for package, version in sorted(FEATURE_DEPENDENCIES[feature].items()):
                  print(package + '==' + version)
          PYDEPS
          uv pip install --python .qualification-venv/bin/python -r qualification-feature-requirements.txt
          .qualification-venv/bin/python -c 'import sys,sqlite3; print(sys.version, sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3,51,3)'
      - name: Full release regression and original sandbox qualification
        if: env.NANA_FULL_QUALIFICATION == 'true'
        run: |
          umask 077
          echo full > qualification-level.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          .qualification-venv/bin/python - <<'PYPREFLIGHT'
          from nana_core.continuity.open_agency import code_skills
          original_run=code_skills.subprocess.run
          def report_probe_failure(*args, **kwargs):
              result=original_run(*args, **kwargs)
              if result.returncode:
                  print('original sandbox process stderr:', result.stderr[-4096:].decode(errors='replace'))
              return result
          code_skills.subprocess.run=report_probe_failure
          probe=code_skills.IsolatedSkillRunner().qualify()
          print(probe)
          assert probe['state']=='AVAILABLE' and all(probe['checks'].values())
          PYPREFLIGHT
          .qualification-venv/bin/python -m pytest -q --junitxml=qualification-core.xml \
            --basetemp=/tmp/nq --old-sqlite-python=/usr/local/bin/nana-old-sqlite-python
      - name: Affected source integration checks
        if: env.NANA_FULL_QUALIFICATION != 'true'
        env:
          NANA_CHANGE_BASE: ${{ github.event.before }}
        run: |
          umask 077
          echo targeted > qualification-level.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE"
          .qualification-venv/bin/python - <<'PYTARGET'
          import os, pathlib, subprocess, sys
          base=os.environ.get('NANA_CHANGE_BASE') or 'HEAD^'
          if set(base)=={'0'}: base='HEAD^'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          if any(path in {'src/nana_core/life/live_api/contracts.py','tools/nana_first_life_android_v2/schema.py','src/nana_core/life/live_api/provider_settings.py','src/nana_core/life/live_api/platform_settings.py','src/nana_core/life/live_api/platform_credentials.py','src/nana_core/life/live_api/memory_notes.py'} for path in changed):
              subprocess.run([sys.executable,'-m','tools.nana_first_life_android_v2.schema'],check=True)
              subprocess.run(['git','diff','--exit-code','--','contracts/nana-space-live-v2/api-v2.schema.json','contracts/nana-space-live-v2/openapi.json','apps/nana-space/src/data/v2.generated.ts'],check=True)
          groups=[
            (('live_api/auth.py','live_api/server.py','test_response_authorization.py'), ['tests/first_life_android_v2/test_response_authorization.py','tests/first_life_android_v2/test_auth_contract.py','tests/first_life_android_v2/test_http_integration.py','tests/first_life_android_v2/test_chat_stream_http.py']),
            (('tests/independent_life/test_dialogue.py','tools/nana_first_life_android_v2/dev_serve.py'), ['tests/independent_life/test_dialogue.py','tests/independent_life/test_streaming.py','tests/first_life_android_v2/test_chat_stream_http.py']),
            (('lived_language.py','live_api/bridge.py','live_api/contracts.py','long_feedback','feedback.ts','feedback.test.ts','nana-space-live-v2'),
             ['tests/person_self/test_memory_use_feedback.py','tests/person_self/test_long_feedback_binding.py','tests/person_self/test_learning.py','tests/person_self/test_dialogue_integration.py','tests/first_life_android_v2/test_long_feedback.py','tests/first_life_android_v2/test_http_integration.py']),
            (('continuity/context.py','continuity/retrieval_growth.py','test_retrieval_growth','test_note_recall'), ['tests/independent_life/test_retrieval_growth.py','tests/independent_life/test_retrieval_growth_expanded.py','tests/independent_life/test_note_recall.py','tests/continuous_self/test_context.py','tests/person_self/test_context_selection_efficiency.py','tests/living_release_v4/test_private_context.py']),
            (('live_api/provider_settings.py','live_api/server.py','test_provider_runtime_settings.py'), ['tests/first_life_android_v2/test_provider_runtime_settings.py','tests/first_life_android_v2/test_provider_models.py','tests/first_life_android_v2/test_http_integration.py']),
            (('subject/context_fit.py','test_context_fit.py'), ['tests/vision_first/test_context_fit.py','tests/independent_life/test_dialogue.py']),
            (('subject/policy.py','open_life/opportunities.py','tests/open_life/'), ['tests/open_life','tests/open_autonomy/test_delivery.py','tests/open_autonomy/test_planning.py','tests/precision/test_planning.py','tests/precision/test_recovery.py']),
            (('life/control.py','life/application.py','life/dialogue_contracts.py','world_loop/cognition.py','life/surfaces.py','life/__main__.py','live_api/bridge.py','live_api/contracts.py','live_api/server.py','test_continuous_inputs.py','test_conversation_sequence.py','test_message_sequence_http.py'), ['tests/first_life_android_v2/test_message_sequence_http.py','tests/first_life_android_v2/test_conversation_sequence.py','tests/first_life_android_v2/test_continuous_inputs.py','tests/first_life_android_v2/test_http_integration.py','tests/first_life_android_v2/test_chat_stream_http.py','tests/independent_life/test_dialogue.py','tests/independent_life/test_streaming.py','tests/person_self/test_history_bound.py','tests/person_self/test_rest_and_attribution.py']),
            (('continuity/privacy.py','test_privacy_copy_increment.py'), ['tests/continuous_self/test_privacy.py','tests/continuous_self/test_privacy_copy_increment.py','tests/person_self/test_memory_use_feedback.py']),
            (('bridge_wire.py','test_r044_filesystem.py'), ['tests/nana_shadow/test_r044_filesystem.py','tests/nana_shadow/test_r044_races.py','tests/nana_shadow/test_r044_privacy.py']),
            (('b1_backup.py','test_rev3_operator.py'), ['tests/first_life_android_v2/test_rev3_operator.py']),
            (('nana_portable_cloud/','packaging/portable/','requirements-core-dev.lock'), ['tests/engineering_quality/test_portable_missing_import.py','tests/portable_cloud_runtime']),
            (('continuity/person_self.py',), ['tests/person_self'])]
          selected=sorted({test for markers, tests in groups if any(any(marker in path for marker in markers) for path in changed) for test in tests})
          if not selected: selected=['tests/first_life_android_v2/test_http_integration.py']
          print('TARGETED_CHECKS',selected,flush=True)
          assert all(pathlib.Path(test).exists() for test in selected)
          subprocess.run([sys.executable,'-m','pytest','-q','--junitxml=qualification-core.xml','--basetemp=/tmp/nq',*selected],check=True)
          PYTARGET
      - name: Matching portable candidate, reproducible builds and offline installation
        if: env.NANA_FULL_QUALIFICATION == 'true'
        run: |
          uv pip install --python .qualification-venv/bin/python pip==25.3
          .qualification-venv/bin/python - <<'PY' > qualification-wheel-requirements.txt
          from tools.nana_portable_cloud.build import DEPENDENCIES, FEATURE_DEPENDENCIES
          dependencies = dict(DEPENDENCIES)
          for feature in ('HOST_VAULT', 'PUBLIC_VIDEO_FRAMES'):
              dependencies.update(FEATURE_DEPENDENCIES[feature])
          for package, version in sorted(dependencies.items()):
              print(package + '==' + version)
          PY
          .qualification-venv/bin/python -m pip download --only-binary=:all: --no-deps \
            --dest qualification-wheels --requirement qualification-wheel-requirements.txt
          for replica in a b; do
            .qualification-venv/bin/python tools/nana_portable_cloud/build.py --revision "$GITHUB_SHA" \
              --wheels qualification-wheels --output "qualification-build-$replica" \
              --feature HOST_VAULT --feature PUBLIC_VIDEO_FRAMES > "qualification-build-$replica.json"
          done
          .qualification-venv/bin/python - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys
          a = json.loads(pathlib.Path('qualification-build-a.json').read_text())
          b = json.loads(pathlib.Path('qualification-build-b.json').read_text())
          assert a['sha256'] == b['sha256'] and a['source_commit'] == b['source_commit'] == os.environ['GITHUB_SHA']
          subprocess.run([sys.executable, '-I', 'qualification-build-a/nana-unpack.py', a['archive'],
                          '--sha256', a['sha256'], '--destination', 'qualification-installed'], check=True)
          subprocess.run([sys.executable, '-I', 'qualification-installed/bootstrap.py', 'install'], check=True)
          out = pathlib.Path('qualification-portable'); out.mkdir()
          for name in ('nana-first-life-portable-v1.tar.gz', 'nana-first-life-portable-v1.tar.gz.sha256', 'nana-unpack.py'):
              shutil.copyfile(pathlib.Path('qualification-build-a') / name, out / name)
          (out / 'source-and-build.json').write_text(json.dumps({
              'source_commit': a['source_commit'], 'sha256': a['sha256'], 'bundle_files': a['bundle_files'],
              'two_builds_match': True, 'offline_install': 'PASS', 'production_changed': False,
              'CURRENT_updated': False, 'real_provider_calls': 0, 'physical_phone': 'NOT_RUN'}, indent=2) + chr(10))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nana-core-feedback-${{ github.sha }}
          path: |
            qualification-core.xml
            qualification-level.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.NANA_FULL_QUALIFICATION == 'true'
        with:
          name: nana-portable-candidate-${{ github.sha }}
          path: qualification-portable
          retention-days: 14

  client-feedback:
    needs: affected-components
    if: needs.affected-components.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/nana-space
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node tests/feedback.node.ts
      - run: npx playwright install --with-deps chromium
      - name: Four-mode feedback, complete retained replies and UNKNOWN at desktop and phone widths
        run: |
          cat > playwright.qualification.config.ts <<'CONFIG'
          import base from './playwright.v3.config';
          export default {...base, use: {...base.use,
            launchOptions: {...base.use?.launchOptions, executablePath: undefined}}};
          CONFIG
          npx playwright test --config playwright.qualification.config.ts --grep 'complete retained long reply|explicit reply feedback|four memory-use feedback|SYNTHETIC local chat inbox|SYNTHETIC queued sequence|SYNTHETIC long reply feedback|SYNTHETIC model setup|SYNTHETIC model catalog|SYNTHETIC runtime budget'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nana-client-feedback-${{ github.sha }}
          path: |
            apps/nana-space/test-results
            apps/nana-space/dist
          retention-days: 14
