name: Nana Next source qualification

# Explicit qualification of the inherited continuation; no deployment or model calls.
on:
  workflow_dispatch:
  push:
    branches: [dev/nana-core-next-experience-codex]
    paths:
      - .github/workflows/nana-next-qualification.yml
      - tools/nana_portable_cloud/build.py
      - packaging/portable/runtime-files.txt
      - src/nana_core/continuity/privacy.py
      - tests/continuous_self/test_privacy_copy_increment.py
      - src/nana_core/continuity/subject/policy.py
      - tests/open_autonomy/test_delivery.py
      - tools/nana_astrbot_shadow/bridge_wire.py
      - src/plugins/astrbot_plugin_nana_shadow_observer/bridge_wire.py
      - tests/nana_shadow/test_r044_filesystem.py
      - src/nana_core/life/control.py
      - src/nana_core/life/surfaces.py
      - src/nana_core/life/__main__.py
      - src/nana_core/life/application.py
      - src/nana_core/continuity/person_self.py
      - tests/first_life_android_v2/test_continuous_inputs.py
      - tools/nana_first_life_android_v2/b1_backup.py
      - tests/first_life_android_v2/test_rev3_operator.py
      - apps/nana-space/**

permissions:
  contents: read

jobs:
  original-core-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Run the original bwrap qualification on the disposable GitHub runner host.
    # A nested Debian Actions container cannot mount /proc under the hosted
    # runner's container boundary, even when the original probe is otherwise valid.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Runner tools and read-only old SQLite host fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor bubblewrap ffmpeg gnupg
          if sudo grep -RqsE 'profile[[:space:]]+[^[:space:]]+[[:space:]]+/usr/bin/bwrap([[:space:]]|$)' /etc/apparmor.d; then
            echo 'Existing AppArmor attachment for /usr/bin/bwrap; refusing to replace it.' >&2
            exit 1
          fi
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          command -v docker
          mkdir -p /tmp/nana-old-sqlite-context
          docker build --tag nana-old-sqlite:3.46.1 -f - /tmp/nana-old-sqlite-context <<'DOCKERFILE'
          FROM debian:trixie-slim
          RUN apt-get update && apt-get install --yes --no-install-recommends python3 && rm -rf /var/lib/apt/lists/* && /usr/bin/python3 -I -c 'import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version == "3.46.1"'
          ENTRYPOINT ["/usr/bin/python3"]
          DOCKERFILE
          sudo tee /usr/local/bin/nana-old-sqlite-python >/dev/null <<'WRAPPER'
          #!/bin/sh
          exec docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,src=/tmp/nq,dst=/tmp/nq,readonly" \
            --workdir "$GITHUB_WORKSPACE" nana-old-sqlite:3.46.1 "$@"
          WRAPPER
          sudo chmod 0755 /usr/local/bin/nana-old-sqlite-python
          mkdir -p /tmp/nq
          /usr/local/bin/nana-old-sqlite-python -I -c 'import sqlite3; assert sqlite3.sqlite_version == "3.46.1"'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # setup-python's host-linked SQLite failed the existing minimum gate.
      # Use a private standalone interpreter; never replace a system library.
      - uses: astral-sh/setup-uv@v6
      - run: |
          umask 077
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          command -v ffmpeg
          command -v gpgconf
          command -v bwrap
          uv python install 3.12.14
          uv venv --python 3.12.14 .qualification-venv
          uv pip install --python .qualification-venv/bin/python -r requirements-core-dev.lock
          .qualification-venv/bin/python - <<'PYDEPS' > qualification-feature-requirements.txt
          from tools.nana_portable_cloud.build import FEATURE_DEPENDENCIES
          for feature in ('HOST_VAULT', 'PUBLIC_VIDEO_FRAMES'):
              for package, version in sorted(FEATURE_DEPENDENCIES[feature].items()):
                  print(package + '==' + version)
          PYDEPS
          uv pip install --python .qualification-venv/bin/python -r qualification-feature-requirements.txt
          .qualification-venv/bin/python -c 'import sys,sqlite3; print(sys.version, sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3,51,3)'
      - name: Complete exact-source regression, original assertions and legacy isolation
        run: |
          umask 077
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          .qualification-venv/bin/python - <<'PYPREFLIGHT'
          from nana_core.continuity.open_agency import code_skills
          original_run=code_skills.subprocess.run
          def report_probe_failure(*args, **kwargs):
              result=original_run(*args, **kwargs)
              if result.returncode:
                  print('original sandbox process stderr:', result.stderr[-4096:].decode(errors='replace'))
              return result
          code_skills.subprocess.run=report_probe_failure
          probe=code_skills.IsolatedSkillRunner().qualify()
          print(probe)
          assert probe['state']=='AVAILABLE' and all(probe['checks'].values())
          PYPREFLIGHT
          .qualification-venv/bin/python -m pytest -q --junitxml=qualification-core.xml \
            --basetemp=/tmp/nq --old-sqlite-python=/usr/local/bin/nana-old-sqlite-python
      - name: Matching portable candidate, reproducible builds and offline installation
        run: |
          uv pip install --python .qualification-venv/bin/python pip==25.3
          .qualification-venv/bin/python - <<'PY' > qualification-wheel-requirements.txt
          from tools.nana_portable_cloud.build import DEPENDENCIES, FEATURE_DEPENDENCIES
          dependencies = dict(DEPENDENCIES)
          for feature in ('HOST_VAULT', 'PUBLIC_VIDEO_FRAMES'):
              dependencies.update(FEATURE_DEPENDENCIES[feature])
          for package, version in sorted(dependencies.items()):
              print(package + '==' + version)
          PY
          .qualification-venv/bin/python -m pip download --only-binary=:all: --no-deps \
            --dest qualification-wheels --requirement qualification-wheel-requirements.txt
          for replica in a b; do
            .qualification-venv/bin/python tools/nana_portable_cloud/build.py --revision "$GITHUB_SHA" \
              --wheels qualification-wheels --output "qualification-build-$replica" \
              --feature HOST_VAULT --feature PUBLIC_VIDEO_FRAMES > "qualification-build-$replica.json"
          done
          .qualification-venv/bin/python - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys
          a = json.loads(pathlib.Path('qualification-build-a.json').read_text())
          b = json.loads(pathlib.Path('qualification-build-b.json').read_text())
          assert a['sha256'] == b['sha256'] and a['source_commit'] == b['source_commit'] == os.environ['GITHUB_SHA']
          subprocess.run([sys.executable, '-I', 'qualification-build-a/nana-unpack.py', a['archive'],
                          '--sha256', a['sha256'], '--destination', 'qualification-installed'], check=True)
          subprocess.run([sys.executable, '-I', 'qualification-installed/bootstrap.py', 'install'], check=True)
          out = pathlib.Path('qualification-portable'); out.mkdir()
          for name in ('nana-first-life-portable-v1.tar.gz', 'nana-first-life-portable-v1.tar.gz.sha256', 'nana-unpack.py'):
              shutil.copyfile(pathlib.Path('qualification-build-a') / name, out / name)
          (out / 'source-and-build.json').write_text(json.dumps({
              'source_commit': a['source_commit'], 'sha256': a['sha256'], 'bundle_files': a['bundle_files'],
              'two_builds_match': True, 'offline_install': 'PASS', 'production_changed': False,
              'CURRENT_updated': False, 'real_provider_calls': 0, 'physical_phone': 'NOT_RUN'}, indent=2) + chr(10))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nana-core-feedback-${{ github.sha }}
          path: qualification-core.xml
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: nana-portable-candidate-${{ github.sha }}
          path: qualification-portable
          retention-days: 14

  client-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/nana-space
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node tests/feedback.node.ts
      - run: npx playwright install --with-deps chromium
      - name: Four-mode feedback, complete retained replies and UNKNOWN at desktop and phone widths
        run: |
          cat > playwright.qualification.config.ts <<'CONFIG'
          import base from './playwright.v3.config';
          export default {...base, use: {...base.use,
            launchOptions: {...base.use?.launchOptions, executablePath: undefined}}};
          CONFIG
          npx playwright test --config playwright.qualification.config.ts --grep 'complete retained long reply|explicit reply feedback|four memory-use feedback|SYNTHETIC local chat inbox'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nana-client-feedback-${{ github.sha }}
          path: |
            apps/nana-space/test-results
            apps/nana-space/dist
          retention-days: 14
