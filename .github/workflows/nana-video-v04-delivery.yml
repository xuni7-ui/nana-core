name: Nana Video v0.4 standalone
on:
  push:
    branches: [delivery/astrbot-nana-video-v0.4.0]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            delivery/astrbot_plugin_nana_video_v0.4.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build standalone ZIP
        run: |
          cd delivery/astrbot_plugin_nana_video_v0.4.0
          python -m zipfile -c /tmp/astrbot_plugin_nana_video_v0.4.0.zip astrbot_plugin_nana_video
          python -m zipfile -t /tmp/astrbot_plugin_nana_video_v0.4.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_nana_video_v0.4.0
          path: /tmp/astrbot_plugin_nana_video_v0.4.0.zip
      - name: Test extracted package
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install 'Pillow>=10,<13' pytest
          mkdir /tmp/nana-v4
          cd /tmp/nana-v4
          unzip -q /tmp/astrbot_plugin_nana_video_v0.4.0.zip
          python -m unittest discover -s astrbot_plugin_nana_video/tests -p 'test_adapter.py' -v
          python -m unittest discover -s astrbot_plugin_nana_video/tests -p 'test_policy.py' -v
          python -m pytest -q astrbot_plugin_nana_video/tests/test_upstream_original.py
      - name: Actual engine and mock provider
        run: |
          cd /tmp/nana-v4
          python - <<'PY'
          import asyncio, subprocess
          from pathlib import Path
          from types import SimpleNamespace
          from PIL import Image
          from astrbot_plugin_nana_video.engine.video_perception import perceive_video
          from astrbot_plugin_nana_video.engine.video_audio_probe import _run_bounded
          from astrbot_plugin_nana_video.tests.test_adapter import AdapterTests, Video
          async def main():
              case=AdapterTests('test_material_and_container')
              await case.asyncSetUp()
              try:
                  case.main.perceive_video=perceive_video
                  case.main._run_bounded=_run_bounded
                  case.plugin.cfg.update({'max_frames':4})
                  clip=Path(case.tmp.name)/'blue.mp4'
                  subprocess.run(['ffmpeg','-v','error','-f','lavfi','-i','color=black:s=320x180:r=2:d=12','-vf',"drawbox=x=10:y=10:w=100:h=80:color=blue:t=fill:enable='between(t,5,5.49)'",'-c:v','mpeg4','-threads','1','-y',str(clip)],check=True,timeout=30)
                  calls=[]
                  async def vision(**kw):
                      found=False
                      for path in kw['image_urls']:
                          with Image.open(path) as im:
                              r,g,b=im.convert('RGB').getpixel((40,40))
                              found |= b>100 and b>r+50 and b>g+50
                      calls.append(found)
                      return SimpleNamespace(completion_text='blue' if found else 'not visible')
                  case.ctx.provider.text_chat=vision
                  result=await case.ask('第5秒发生了什么',Video(clip))
                  assert '视觉观察：blue' in result,result
                  assert calls==[True]
                  assert await case.ask('今天聊聊视频')=='original'
                  result=await case.ask('回看第6秒发生了什么')
                  assert '重新采样' in result and len(calls)==2,result
                  assert case.plugin.budget.total()==2
                  print('real B engine + mocked AstrBot/provider: PASS')
              finally:
                  await case.asyncTearDown()
          asyncio.run(main())
          PY
