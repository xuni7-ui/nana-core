name: Nana governance checks

on:
  pull_request:
    branches: [dev/nana-core-next-experience-codex]
    paths:
      - .github/workflows/nana-governance-check.yml
      - .github/workflows/nana-next-qualification.yml
      - AGENTS.md
      - README.md
      - docs/nana_next_experience/GOVERNANCE_SOURCE_MAP.md
      - tools/nana_next_experience/check_governance_links.py
      - tools/nana_portable_cloud/build.py
      - tests/engineering_quality/test_portable_missing_import.py
      - tools/nana_next_experience/verify_delivery.py
      - tests/first_life_android_v2/test_delivery_consistency.py
      - requirements-core-dev.lock

permissions:
  contents: read

jobs:
  governance-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source navigation
        run: python3 tools/nana_next_experience/check_governance_links.py
      - name: Check portable import boundary
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/engineering_quality -p test_portable_missing_import.py
      - name: Check delivery component consistency
        run: |
          python3 -m venv /tmp/nana-governance-tests
          pytest_requirement=$(sed -n '/^pytest==/p' requirements-core-dev.lock)
          /tmp/nana-governance-tests/bin/python -m pip install "$pytest_requirement"
          PYTHONDONTWRITEBYTECODE=1 /tmp/nana-governance-tests/bin/python -m pytest -q tests/first_life_android_v2/test_delivery_consistency.py
