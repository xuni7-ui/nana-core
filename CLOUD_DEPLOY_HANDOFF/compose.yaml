name: nana-core-independent
services:
  core:
    # Preparation has NO enabled service. The later production approval must
    # also replace safe 'verify' with 'serve' after all original activation gates.
    profiles: [after-explicit-activation-approval]
    image: ${NANA_VERIFIED_IMAGE:?supply_verified_image_id}
    pull_policy: never
    user: '999:999'
    init: true
    command: [verify]
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 20s
    ports: ['127.0.0.1:18765:18766']
    volumes:
      - type: bind
        source: ${NANA_RUNTIME_SLOT:?supply_verified_new_slot_runtime}
        target: /opt/nana-core/runtime
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/nana-core/data
        target: /opt/nana-core/data
        bind: {create_host_path: false}
      - type: bind
        source: /srv/nana-core/logs
        target: /opt/nana-core/logs
        bind: {create_host_path: false}
      - type: bind
        source: /srv/nana-core/backups
        target: /opt/nana-core/backups
        bind: {create_host_path: false}
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m,uid=999,gid=999,mode=1770']
    logging:
      driver: json-file
      options: {max-size: 2m, max-file: '3'}
    healthcheck:
      test: [CMD, /usr/bin/python3, -I, /usr/local/lib/nana/container_entry.py, health]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 20s
    # No docker.sock, hostroot, AstrBot/QQ/Iris, devices, credentials or bwrap.
