[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nana-core-offline"
version = "0.1.0"
description = "Independent Nana Core continuity experiment and bounded S5 ModelPort evaluation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13.4,<=2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
quality = ["ruff==0.14.1", "mypy==1.18.2"]

[project.scripts]
nana-presence = "nana_core.presence.cli:main"
nana-iris-export = "nana_core.integration.exporter:main"
nana-cloud-preflight = "nana_core.integration.preflight:main"
nana-cloud-shadow-rehearsal = "nana_core.integration.rehearsal:main"
nana-engineering-lab = "nana_core.integration.engineering_lab:main"
nana-offline = "nana_core.experiment:main"
nana-semantic = "nana_core.semantic.runner:main"
nana-migration = "nana_core.migration.experiment:main"
nana-development = "nana_core.development.lab:main"
nana-web = "nana_core.development.web_lab:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nana_core*"]

[tool.setuptools.package-data]
nana_core = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["s0: contracts", "s1: storage and identity", "s2: action kernel", "s3: goal loop", "s4: constrained experience", "s5: model adapter and semantic evaluation engineering", "s6: synthetic migration preparation", "acceptance: Architecture V1 E01-E20"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "C901"]
