[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nana-core-offline"
version = "0.1.0"
description = "Independent, offline Nana Core continuity experiment (S0-S4)"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
nana-offline = "nana_core.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nana_core*"]

[tool.setuptools.package-data]
nana_core = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/offline_continuity"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["s0: contracts", "s1: storage and identity", "s2: action kernel", "s3: goal loop", "s4: constrained experience", "acceptance: Architecture V1 E01-E20"]
